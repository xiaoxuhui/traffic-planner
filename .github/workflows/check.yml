name: Check traffic planner
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run verify:dist
      - run: git diff --exit-code -- dist
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser regression in an isolated local server
        run: |
          node scripts/serve.js > /tmp/traffic-planner-server.log 2>&1 &
          pnpm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traffic-browser-evidence
          path: |
            doc/evidence/
            /tmp/traffic-planner-server.log
